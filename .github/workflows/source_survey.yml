name: Source overlap survey (diagnostic)
# Phase 0 diagnostic for the splice / segment-assembly work (forward_plan §2.C
# C16). Runs scripts/source_overlap_survey.py from the GitHub runner so the
# CREDENTIALED sources are actually reachable — FRED, BLS, e-Stat and BdF all
# fail locally without their secrets, which left 18 contested columns
# unsurveyed on the first (uncredentialed) pass.
#
# Read-only with respect to data/: the script fetches and compares, and writes
# only source_overlap_survey.md, which this workflow commits so the findings
# are reviewable in the repo.
#
# Manual trigger only. Delete this workflow + the report once the segment work
# has landed (same lifecycle as ifo_probe.yml).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run source-overlap survey
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          BDF_API_KEY: ${{ secrets.BDF_API_KEY }}
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/source_overlap_survey.py
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-overlap-survey
          path: source_overlap_survey.md
          retention-days: 90
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f source_overlap_survey.md || true
          git diff --staged --quiet || git commit -m "Source overlap survey report ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
